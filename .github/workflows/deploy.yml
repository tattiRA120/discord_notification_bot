name: Deploy to GCE

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '**.sh'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        pytest || echo "No tests found, skipping"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit
        
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1

    - name: Deploy to Server
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USERNAME }}
        key: ${{ secrets.GCE_SSH_KEY }}
        port: ${{ secrets.GCE_SSH_PORT }}
        script: |
          set -e
          cd ~/discord_bot
          git fetch origin main
          git reset --hard origin/main
          if [ ! -f .env ]; then
            touch .env
          fi
          if grep -q "DISCORD_WEBHOOK_URL=" .env; then
            sed -i 's|DISCORD_WEBHOOK_URL=.*|DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"|' .env
          else
            echo 'DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"' >> .env
          fi
          source ~/discord_bot/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo supervisorctl restart discord-bot
