name: Debug Secret Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_PORT: ${{ secrets.GCE_SSH_PORT }}
          GCE_USER: ${{ secrets.GCE_USERNAME }}
        run: |
          if [ "$GCE_HOST" = "35.212.142.59" ]; then
            echo "HOST MATCHES 35.212.142.59: YES"
          else
            echo "HOST MATCHES 35.212.142.59: NO"
            echo "Host length: ${#GCE_HOST}"
          fi
          if [ "$GCE_PORT" = "21022" ]; then
            echo "PORT MATCHES 21022: YES"
          elif [ "$GCE_PORT" = "22" ]; then
            echo "PORT MATCHES 22: YES (WARNING: It is set to standard 22, not 21022!)"
          else
            echo "PORT MATCHES 21022: NO"
            echo "Port is: $GCE_PORT"
          fi
          echo "USER is: $GCE_USER"
          
          echo "Testing netcat to 35.212.142.59:21022 directly..."
          nc -zv -w 5 35.212.142.59 21022 || echo "Direct NC to 21022 failed!"
          
          echo "Testing netcat using secret host and port..."
          nc -zv -w 5 "$GCE_HOST" "$GCE_PORT" || echo "NC to secret host/port failed!"
